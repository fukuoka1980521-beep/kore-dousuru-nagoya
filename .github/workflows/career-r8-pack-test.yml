name: Career Up FORM RULE PACK test
on:
  push:
    branches: [master]
    paths:
      - "src/app/assist/career-r8.js"
      - "tests/career-r8-pack.test.js"
      - ".github/workflows/career-r8-pack-test.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/career-r8-pack.test.js
