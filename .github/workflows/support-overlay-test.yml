name: support-overlay-test
on:
  push:
    paths:
      - "src/app/support-overlay.js"
      - "src/app/index.html"
      - "tests/support-overlay.test.cjs"
      - ".github/workflows/support-overlay-test.yml"
  pull_request:
    paths:
      - "src/app/support-overlay.js"
      - "src/app/index.html"
      - "tests/support-overlay.test.cjs"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/support-overlay.test.cjs
